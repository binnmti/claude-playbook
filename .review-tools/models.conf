# Reviewer model settings, sourced by review-commit.sh / review-push.sh.
# Commit review = quick pass, push review = deeper pass. Keep every line live.

# enabled reviewers per phase -- remove a name to turn one off (a listed
# reviewer still needs its CLI installed; vllm is a direct API call)
REVIEWERS_COMMIT="codex copilot agy vllm"
REVIEWERS_PUSH="codex copilot agy vllm"

# commit
CODEX_MODEL_COMMIT="gpt-5.4-mini"
CODEX_EFFORT_COMMIT=low
COPILOT_MODEL_COMMIT="auto"
AGY_MODEL_COMMIT="GPT-OSS 120B (Medium)"
VLLM_MODEL_COMMIT="nvidia/Gemma-4-31B-IT-NVFP4"

# push
CODEX_MODEL_PUSH="gpt-5.5"
CODEX_EFFORT_PUSH=medium
COPILOT_MODEL_PUSH="auto"
AGY_MODEL_PUSH="Gemini 3.5 Flash (Low)"
VLLM_MODEL_PUSH="nvidia/Gemma-4-31B-IT-NVFP4"

# vllm reviewer = OpenAI-compatible chat completions, called with curl (codex
# 経由は不可: vLLM の Responses streaming が output_item.done を送らない)。
# エージェントではないので diff はプロンプトに埋め込まれる (60KB でカット)。
VLLM_BASE_URL="https://vllm.qiqb.dev/v1"
VLLM_API_KEY="***REMOVED-LEAKED-KEY***"

# choices -- codex: gpt-5.5 / gpt-5.4 / gpt-5.4-mini
#            agy (see `agy models`): Gemini 3.5 Flash (Low|Medium|High) /
#              Gemini 3.1 Pro (Low|High) / Claude Sonnet 4.6 (Thinking) /
#              Claude Opus 4.6 (Thinking) / GPT-OSS 120B (Medium)
#            copilot: auto / gpt-5.4 / ... (`copilot` 内 /model 参照)
#            vllm: `curl $VLLM_BASE_URL/models` で確認
